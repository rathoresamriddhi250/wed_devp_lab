<!DOCTYPE html>
<html >

<head>
   

    <title>Responsive Card Grid</title>

    <style>
        /* Body */

body {
    margin: 0;
    font-family: Arial;
    background-color: pink;
}


nav {
    background-color: black;
    color: white;
    padding: 15px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.links {
    display: flex;
    gap: 20px;
}

nav a {
    color: white;
    text-decoration: none;
}




main {
    padding: 20px;
}




.card-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
}




.card {
    background-color: white;
    width: 200px;
    padding: 20px;
    border-radius: 10px;
}



footer {
    background-color: black;
    color: white;
    text-align: center;
    padding: 10px;
}




@media (max-width: 600px) {

    nav {
        flex-direction: column;
    }

    .links {
        flex-direction: column;
        align-items: center;
    }

    .card {
        width: 100%;
    }

}
    </style>
</head>

<body>

    <header>
        <nav>
            <h1>My Website</h1>

            <div class="links">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Projects</a>
                <a href="#">Contact</a>
            </div>
        </nav>
    </header>

   
    <main>

        <h2>My Projects</h2>

        
        <section class="card-container">

            <div class="card">
                <h3>Project 1</h3>
                <p>My first HTML project.</p>
            </div>

            <div class="card">
                <h3>Project 2</h3>
                <p>My CSS project.</p>
            </div>

            <div class="card">
                <h3>Project 3</h3>
                <p>My Java project.</p>
            </div>

            <div class="card">
                <h3>Project 4</h3>
                <p>My Python project.</p>
            </div>

        </section>

    </main>


    <footer>
        <p>Copyright 2026 My Website</p>
    </footer>

</body>

</html>
