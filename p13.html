<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flexbox and Grid</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ECF0F1;
      color: #34495E;
      margin: 0;
    }

    .page {
      display: grid;
      grid-template-columns: 200px 1fr;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "top top"
        "side main"
        "foot foot";
      min-height: 100vh;
      gap: 15px;
    }

    header {
      grid-area: top;
      background: #2C3E57;
      color: #ECF0F1;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav {
      display: flex;
      gap: 15px;
    }

    nav a {
      color: #ECF0F1;
      text-decoration: none;
    }

    aside {
      grid-area: side;
      background: #BDC3C7;
      padding: 15px;
    }

    main {
      grid-area: main;
      padding: 15px;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    .card {
      flex: 1 1 200px;
      background: white;
      border: 1px solid #BDC3C7;
      border-radius: 8px;
      padding: 15px;
    }

    footer {
      grid-area: foot;
      background: #34495E;
      color: #ECF0F1;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>My Site</h1>
      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <aside>
      <h2>Menu</h2>
      <p>Links and filters go here.</p>
    </aside>

    <main>
      <h2>Projects</h2>
      <div class="cards">
        <div class="card"><h3>Bio Page</h3><p>Semantic HTML.</p></div>
        <div class="card"><h3>Portfolio</h3><p>CSS variables.</p></div>
        <div class="card"><h3>Newspaper</h3><p>CSS Grid.</p></div>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 My Site</p>
    </footer>
  </div>
</body>
</html>
